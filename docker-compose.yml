services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SQLITE_DB_PATH=/app/data/securesignin.db
    volumes:
      - encryption_keys:/app/keys
      - sqlite_data:/app/data
    networks:
      app-network:
        aliases:
          - app-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  sqlite_data:
  encryption_keys:

networks:
  app-network:
    driver: bridge
