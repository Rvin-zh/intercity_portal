directories:
  output: dist
  buildResources: build
appId: com.securesignin.app
productName: Secure Sign In
files:
  - filter:
      - src/**/*
      - node_modules/**/*
      - package.json
extraResources:
  - from: ../
    to: backend
    filter:
      - '**/*'
      - '!electron-app/**'
      - '!.git/**'
      - '!node_modules/**'
      - '!**/*.go'
      - '!**/*.mod'
      - '!**/*.sum'
      - '!Dockerfile'
      - '!docker-compose.yml'
      - '!.dockerignore'
      - '!DOCKER_README.md'
      - '!replit.nix'
      - '!.replit'
      - '!test_db.sh'
      - '!run.sh'
      - '!nohup.out'
      - '!temp_image.html'
linux:
  target:
    - AppImage
    - deb
  category: Utility
win:
  target:
    - portable
    - nsis
  icon: build/icon.ico
  requestedExecutionLevel: requireAdministrator
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Secure Sign In
  runAfterFinish: true
  perMachine: true
electronVersion: 29.4.6
