{{define "content"}}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-card-title">Reset Password</h1>
        
        {{if .Error}}
        <div class="alert alert-error">
            {{.Error}}
        </div>
        {{end}}
        
        {{if .Success}}
        <div class="alert alert-success">
            {{.Success}}
        </div>
        {{end}}
        
        <form id="forgotForm" action="/forgot" method="POST">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Username" required>
            </div>
            
            <div class="form-group">
                <label for="dob" class="form-label">Date of Birth</label>
                <input type="date" id="dob" name="dob" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label for="ssn" class="form-label">Social Security Number</label>
                <input type="text" id="ssn" name="ssn" class="form-input" placeholder="SSN" required>
            </div>
            
            <div style="text-align: center; margin-top: 1.5rem;">
                <button type="submit" class="auth-button auth-button-primary" style="width: 60%; margin: 0 auto; display: block;">Verify Identity</button>
            </div>
            
            <div class="forgot-password">
                <span>Remember your password?</span>
                <a href="/login" class="forgot-link">Sign in</a>
            </div>
        </form>
    </div>
</div>
{{end}}
