{{define "content"}}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-card-title">Forgot Password</h1>
        
        {{if .Error}}
        <div class="alert alert-error">
            {{.Error}}
        </div>
        {{end}}
        
        {{if .Success}}
        <div class="alert alert-success">
            {{.Success}}
        </div>
        {{end}}
        
        <form id="forgotForm" action="/forgot" method="POST">
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com" autocomplete="email">
            </div>
            
            <div style="text-align: center; margin-top: 1.5rem;">
                <button type="submit" class="auth-button auth-button-primary" style="width: 100%;">Reset Password</button>
            </div>
            
            <div style="text-align: center; margin-top: 1rem;">
                <a href="/login" class="forgot-link">Back to login</a>
            </div>
        </form>
    </div>
</div>
{{end}}
