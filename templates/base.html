{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="bg-transport"></div>
    
    <div class="container">
        <nav class="nav">
            <a href="/" class="nav-item {{if eq .ActivePage "home"}}active{{end}}">Home</a>
            <span style="margin: 0 0.25rem; line-height: 2rem; color: #e63946; font-weight: bold;">--></span>
            <a href="/login" class="nav-item {{if eq .ActivePage "login"}}active{{end}}">Sign in</a>
        </nav>
        
        {{block "content" .}}{{end}}
    </div>
    
    <script src="/static/js/script.js"></script>
</body>
</html>
{{end}}
